<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <!-- Bootstrap 5 (RTL) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="theme-light" style="font-family: 'Cairo', sans-serif;">
    <!-- Theme Toggle -->
    <div class="theme-switch-wrapper" style="left: 20px; right: auto;">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round">
                <i class="fas fa-sun sun-icon"></i>
                <i class="fas fa-moon moon-icon"></i>
            </div>
        </label>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3" style="z-index: 1100;"></div>

    <div class="container py-5">
        <div class="text-center mb-5 header-section">
            <h1 class="display-4 fw-bolder text-gradient" style="font-family: 'Outfit', sans-serif;">Certificate Generator</h1>
            <p class="lead text-muted">إصدار الشهادات بسهولة وسرعة</p>
        </div>

        <div id="main-dashboard" class="glass-card p-4 p-md-5 mb-5 rounded-4 shadow-lg slide-up">
            <form id="generator-form">
                
                <h4 class="mb-4 section-title"><i class="fas fa-cogs me-2 text-primary-theme"></i> الإعدادات العامة</h4>
                <div class="settings-card p-4 rounded-4 mb-4">
                    <div class="row g-3">
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">اختر القالب (Template)</label>
                            <select class="form-select custom-input" id="template_type">
                                <option value="scientific_center">Scientific Center (الأساسي)</option>
                                <option value="ministry">Ministry of Education (وزارة التربية والتعليم)</option>
                            </select>
                        </div>
                        <div class="col-md-12 mb-3 template-ministry-only" style="display: none;">
                            <label class="form-label fw-bold">المادة (Course / Subject)</label>
                            <input type="text" class="form-control custom-input" id="subject_name" placeholder="مثال: Mathematics">
                        </div>
                        <div class="col-md-6 mb-3 template-ministry-only" style="display: none;">
                            <label class="form-label fw-bold">تاريخ البدء (Start Date)</label>
                            <input type="date" class="form-control custom-input" id="start_date">
                        </div>
                        <div class="col-md-6 mb-3 template-ministry-only" style="display: none;">
                            <label class="form-label fw-bold">تاريخ الانتهاء (End Date)</label>
                            <input type="date" class="form-control custom-input" id="end_date">
                        </div>
                        <div class="col-md-6 mb-3 template-ministry-only" style="display: none;">
                            <label class="form-label fw-bold">الدرجة (Grade %)</label>
                            <input type="number" class="form-control custom-input" id="grade" placeholder="مثال: 95">
                        </div>
                        <div class="col-md-6 mb-3 template-ministry-only" style="display: none;">
                            <label class="form-label fw-bold">رقم الشهادة (Certificate ID)</label>
                            <input type="text" class="form-control custom-input" id="certificate_id" placeholder="مثال: MOE-2026-001">
                        </div>
                        <div class="col-md-6 mb-3 template-ministry-only" style="display: none;">
                            <label class="form-label fw-bold">لقب الطالب (Student Title)</label>
                            <select class="form-select custom-input" id="student_title">
                                <option value="Mr./Ms. ">Mr./Ms.</option>
                                <option value="Mr. ">Mr.</option>
                                <option value="Ms. ">Ms.</option>
                                <option value="Mrs. ">Mrs.</option>
                                <option value="Dr. ">Dr.</option>
                                <option value="Eng. ">Eng.</option>
                                <option value="">بدون لقب</option>
                            </select>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">اسم البرنامج / الدورة (Course Name)</label>
                            <input type="text" class="form-control custom-input" id="course_name" placeholder="مثال: The Professional Training Program" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">شهر الإصدار (Month)</label>
                            <select class="form-select custom-input" id="issue_month" required>
                                <option value="January">January</option>
                                <option value="February">February</option>
                                <option value="March">March</option>
                                <option value="April">April</option>
                                <option value="May">May</option>
                                <option value="June">June</option>
                                <option value="July" selected>July</option>
                                <option value="August">August</option>
                                <option value="September">September</option>
                                <option value="October">October</option>
                                <option value="November">November</option>
                                <option value="December">December</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">سنة الإصدار (Year)</label>
                            <select class="form-select custom-input" id="issue_year" required>
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026" selected>2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                                <option value="2029">2029</option>
                                <option value="2030">2030</option>
                            </select>
                        </div>
                    </div>
                </div>

                <h4 class="mb-4 section-title mt-5"><i class="fas fa-chalkboard-teacher me-2 text-primary-theme"></i> إعدادات المدرب (اختياري)</h4>
                <div class="settings-card p-4 rounded-4 mb-4">
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="enable_instructor">
                        <label class="form-check-label fw-bold ms-2" for="enable_instructor">إضافة توقيع المدرب في الشهادة</label>
                    </div>

                    <div id="instructor-details" style="display: none; opacity: 0; transition: opacity 0.4s ease;">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">اسم المدرب (Instructor Name)</label>
                                <input type="text" class="form-control custom-input" id="instructor_name" placeholder="مثال: Ahmed Ali">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">المسمى الوظيفي (Title)</label>
                                <input type="text" class="form-control custom-input" id="instructor_title" placeholder="مثال: Course Instructor">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">توقيع / لوجو المدرب</label>
                                <input type="file" class="form-control custom-input" id="instructor_logo" accept="image/*">
                            </div>
                        </div>
                    </div>
                </div>

                <h4 class="mb-4 section-title mt-5"><i class="fas fa-users me-2 text-primary-theme"></i> بيانات الطلاب</h4>
                
                <ul class="nav nav-pills mb-4 justify-content-center" id="studentTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-pill px-4" id="manual-tab" data-bs-toggle="tab" data-bs-target="#manual" type="button" role="tab"><i class="fas fa-user-edit me-2"></i> إدخال يدوي</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill px-4 ms-2" id="excel-tab" data-bs-toggle="tab" data-bs-target="#excel" type="button" role="tab"><i class="fas fa-file-excel me-2"></i> ملف إكسيل</button>
                    </li>
                </ul>

                <div class="tab-content" id="studentTabsContent">
                    <!-- Manual Entry Tab -->
                    <div class="tab-pane fade show active" id="manual" role="tabpanel">
                        <div class="settings-card p-4 rounded-4 text-center">
                            <label class="form-label fw-bold mb-3">اسم الطالب (Student Name)</label>
                            <input type="text" class="form-control custom-input mx-auto" id="single_student_name" placeholder="اكتب اسم الطالب هنا" style="max-width: 400px;">
                        </div>
                    </div>
                    
                    <!-- Excel Upload Tab -->
                    <div class="tab-pane fade" id="excel" role="tabpanel">
                        <div class="upload-zone excel-zone" id="drop-excel">
                            <input type="file" id="excel_file" class="file-input" accept=".xlsx,.xls">
                            <div class="upload-content">
                                <i class="fas fa-file-excel fa-3x mb-3 text-success"></i>
                                <h5>رفع ملف إكسيل بأسماء الطلاب</h5>
                                <p class="text-muted small mb-0">اسحب الملف هنا أو اضغط للاختيار</p>
                                <div class="file-name mt-2 text-primary-theme fw-bold"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <button type="submit" class="btn btn-primary-theme btn-lg px-5 py-3 rounded-pill animated-btn w-100 w-md-auto" id="process-btn">
                        <span><i class="fas fa-magic me-2"></i> إصدار الشهادات</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Progress Overlay -->
        <div id="progress-container" class="glass-card p-5 rounded-4 text-center shadow-lg slide-up d-none">
            <h3 class="mb-4" id="progress-title">جاري التصميم...</h3>
            <div class="spinner-border text-primary-theme mb-4" style="width: 4rem; height: 4rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            
            <div class="progress mb-3 custom-progress" style="height: 25px;">
                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary-theme" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
            
            <h5 class="text-muted" id="progress-status">تجهيز الأصول...</h5>
            <p class="mb-0 fw-bold text-primary-theme" dir="ltr"><span id="current-student"></span></p>
        </div>

        <!-- Result Page -->
        <div id="result-container" class="glass-card p-5 rounded-4 text-center shadow-lg slide-up d-none">
            <div class="success-checkmark mb-4">
                <i class="fas fa-check-circle text-success" style="font-size: 6rem;"></i>
            </div>
            <h2 class="mb-4 text-gradient">تم الانتهاء بنجاح!</h2>
            
            <div class="row justify-content-center mb-5">
                <div class="col-md-8">
                    <div class="stats-container d-flex justify-content-around p-4 rounded-4">
                        <div class="stat-item">
                            <i class="fas fa-file-pdf fa-2x mb-2 text-danger"></i>
                            <h4 id="res-total-certs">0</h4>
                            <p class="text-muted mb-0">شهادات</p>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-users fa-2x mb-2 text-primary-theme"></i>
                            <h4 id="res-total-students">0</h4>
                            <p class="text-muted mb-0">طلاب</p>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-clock fa-2x mb-2 text-warning"></i>
                            <h4 id="res-time-taken">0s</h4>
                            <p class="text-muted mb-0">الوقت المستغرق</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="#" id="download-btn" class="btn btn-success btn-lg px-4 py-3 rounded-pill animated-btn">
                    <i class="fas fa-download me-2"></i> تحميل ملف PDF
                </a>
                <button type="button" id="restart-btn" class="btn btn-outline-primary-theme btn-lg px-4 py-3 rounded-pill">
                    <i class="fas fa-redo me-2"></i> إصدار جديد
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF (PDF Generation) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js?v=1.2"></script>
</body>
</html>
